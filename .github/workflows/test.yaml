name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Linux (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
        features: [--all-features]
        include:
          - toolchain: nightly
            features: --no-default-features
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Build with ${{ matrix.toolchain }}, ${{ matrix.features }}
        run: |
          cargo +${{ matrix.toolchain }} build \
              --release ${{ matrix.features }} --all-targets

      - name: Test with ${{ matrix.toolchain }}, ${{ matrix.features }}
        run: |
          if [[ "${{ matrix.toolchain }}" == 'nightly' ]]; then
              export RUSTDOCFLAGS='-Zsanitizer=address'
              export RUSTFLAGS='-Zsanitizer=address'
              export ASAN_OPTIONS='detect_leaks=1'
          fi
          cargo +${{ matrix.toolchain }} test \
              --target=x86_64-unknown-linux-gnu \
              ${{ matrix.features }}

      - name: Lint with ${{ matrix.toolchain }}, ${{ matrix.features }}
        run: |
          cargo +${{ matrix.toolchain }} clippy ${{ matrix.features }}

  windows:
    name: Windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.91.0", beta, nightly]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Build with default features
        run: cargo build

      - name: Build with all features
        run: cargo build --all-features

      - name: Test with all features
        run: cargo test --all-features

  conformance:
    name: Check eBPF conformance
    runs-on: ubuntu-latest
    env:
      # Exclude features not supported by rbpf yet.
      # atomic operations - https://github.com/qmonnet/rbpf/issues/47
      # mem-len - Tests assume r2 contains the length of the memory.
      KNOWN_FAILURES: "(lock|mem-len)"
      CONFORMANCE_IMAGE: "ghcr.io/alan-jowett/bpf_conformance@sha256:547765717557e0f222de71fbf26f4bd9621c0149911aa03296024b469dd4598b"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Build plug-in
        run: |
          cargo build --all-features --release --example rbpf_plugin

      - name: Run BPF conformance tests - Interpreter
        run: |
          docker run -v "$GITHUB_WORKSPACE:/rbpf" --rm \
          "$CONFORMANCE_IMAGE" \
          bin/bpf_conformance_runner --test_file_directory tests \
          --plugin_path /rbpf/target/release/examples/rbpf_plugin \
          --exclude_regex "$KNOWN_FAILURES"

      # JIT conformance remains non-blocking due to https://github.com/qmonnet/rbpf/issues/60
      - name: Run BPF conformance tests - JIT
        id: jit
        continue-on-error: true
        run: |
          docker run -v "$GITHUB_WORKSPACE:/rbpf" --rm \
          "$CONFORMANCE_IMAGE" \
          bin/bpf_conformance_runner --test_file_directory tests \
          --plugin_path /rbpf/target/release/examples/rbpf_plugin \
          --exclude_regex "$KNOWN_FAILURES" \
          --plugin_options "--jit"

      - name: Report non-blocking JIT failure
        if: ${{ always() && steps.jit.outcome == 'failure' }}
        run: |
          echo 'JIT conformance failed (non-blocking). See the JIT step log and [upstream issue #60](https://github.com/qmonnet/rbpf/issues/60).' >> "$GITHUB_STEP_SUMMARY"

      - name: Run BPF conformance tests - Cranelift
        run: |
          docker run -v "$GITHUB_WORKSPACE:/rbpf" --rm \
          "$CONFORMANCE_IMAGE" \
          bin/bpf_conformance_runner --test_file_directory tests \
          --plugin_path /rbpf/target/release/examples/rbpf_plugin \
          --exclude_regex "lock" \
          --plugin_options "--cranelift"

  coverage:
    name: Generate code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install development tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --lcov --all --all-features --all-targets --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          retention-days: 14
          if-no-files-found: error
